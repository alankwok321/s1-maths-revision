<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S1 Maths Exam Revision 中一數學考試溫習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2a3a; --muted:#5b6b7f; --line:#dfe5ee; --bg:#f6f8fb; --card:#fff;
  --pri:#2563eb; --pri-soft:#e6eeff; --ok:#16a34a; --ok-soft:#e5f7ec; --bad:#dc2626; --bad-soft:#fdecec;
  --acc:#f59e0b; --acc-soft:#fff4dc; --pur:#7c3aed; --pur-soft:#f1eafe; --teal:#0d9488; --teal-soft:#e0f5f2;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Nunito","Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.55}
button{font-family:inherit;font-size:inherit;cursor:pointer}
i.v,.v{font-family:"Times New Roman",Georgia,serif;font-style:italic;font-size:1.08em;letter-spacing:.01em}
sup{font-size:.68em;line-height:0}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;font-size:.92em;line-height:1.15}
.frac>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .2em}
.frac>span:last-child{padding:0 .2em}
.mixed{display:inline-flex;align-items:center;gap:.05em}

/* language */
.zh{margin-left:.35em}
.blk .zh{display:block;margin-left:0;color:var(--muted);font-size:.93em}
body.m-en .zh{display:none} body.m-zh .en{display:none}
body.m-zh .zh{margin-left:0} body.m-zh .blk .zh{color:var(--ink);font-size:1em}
.term{font-weight:800;color:var(--pri);white-space:nowrap}
.term .tz{font-weight:700;margin-left:.2em}

/* top bar */
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.topin{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:900;font-size:1.1em;display:flex;align-items:center;gap:8px;cursor:pointer}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:.95em}
.langs{margin-left:auto;display:flex;background:var(--bg);border-radius:10px;padding:3px;border:1px solid var(--line)}
.langs button{border:0;background:none;padding:5px 11px;border-radius:8px;font-weight:700;color:var(--muted);font-size:.85em}
.langs button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.12)}
nav.tabs{max-width:1100px;margin:0 auto;padding:0 10px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-weight:700;font-size:.85em;white-space:nowrap}
nav.tabs a.on{background:var(--pri);color:#fff;border-color:var(--pri)}
nav.tabs a.final{background:var(--acc-soft);border-color:#f3d48b}
nav.tabs a.final.on{background:var(--acc);color:#fff;border-color:var(--acc)}

main{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
h1{font-size:1.7em;margin:.2em 0 .1em;line-height:1.25}
h2{font-size:1.3em;margin:1.4em 0 .5em}
h3{font-size:1.1em;margin:.2em 0 .4em}
.sub{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:0 1px 2px rgba(20,30,50,.04)}
.chhead{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.chnum{flex:none;width:54px;height:54px;border-radius:14px;color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.5em}
.secnav{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap;position:sticky;top:96px;z-index:10;background:var(--bg);padding:6px 0}
.secnav button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font-weight:800}
.secnav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* lessons */
.lesson .lnum{display:inline-block;background:var(--pri-soft);color:var(--pri);font-weight:900;border-radius:8px;padding:1px 9px;margin-right:6px;font-size:.85em}
.explain{margin:.4em 0 .8em;padding:0;list-style:none}
.explain li{position:relative;padding:5px 0 5px 30px}
.explain li:before{content:"✔";position:absolute;left:4px;top:5px;color:var(--ok);font-weight:900}
.box{border-radius:12px;padding:12px 14px;margin:10px 0}
.box.tip{background:var(--acc-soft);border:1px solid #f6dca0}
.box.rule{background:var(--pri-soft);border:1px solid #c8d8ff}
.box.trap{background:var(--bad-soft);border:1px solid #f6c7c7}
.box.ok{background:var(--ok-soft);border:1px solid #b9e6c8}
.box .bt{font-weight:900;margin-bottom:3px}
.ex{font-size:1.15em}

/* stepper */
.anim{border:2px solid var(--line);border-radius:14px;overflow:hidden;margin:12px 0;background:#fff}
.anim .stage{position:relative;min-height:180px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;background:linear-gradient(#fbfcfe,#f4f7fb);overflow-x:auto}
.anim .stage svg{max-width:100%;height:auto;overflow:visible}
.anim .cap{padding:12px 16px;border-top:1px solid var(--line);min-height:62px;font-size:1.02em;background:#fff}
.anim .cap .blk{animation:fadeUp .35s ease}
.anim .ctrl{display:flex;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--line);background:var(--bg)}
.anim .ctrl button{border:1px solid var(--line);background:#fff;border-radius:9px;min-width:40px;height:36px;font-weight:800}
.anim .ctrl button.play{background:var(--pri);color:#fff;border-color:var(--pri);min-width:92px}
.anim .ctrl .dots{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.anim .ctrl .dots i{width:9px;height:9px;border-radius:50%;background:#cfd7e3;display:block;cursor:pointer}
.anim .ctrl .dots i.on{background:var(--pri)}
.anim .ctrl .dots i.done{background:#93b1f5}
.anim .title{font-weight:800;padding:8px 14px;background:var(--ink);color:#fff;font-size:.9em;display:flex;align-items:center;gap:8px}
.noanim, .noanim *{transition:none !important;animation:none !important}

.work{font-size:1.35em;line-height:1.5;text-align:left;width:100%;max-width:620px}
.work .ln{padding:3px 10px;border-radius:8px;transition:all .4s;display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.work .ln.new{animation:fadeUp .5s ease}
.work .ln.cur{background:var(--acc-soft)}
.work .ln.old{opacity:.55}
.work .eq{width:1.2em;text-align:center;color:var(--muted)}
.work .note{font-size:.62em;color:var(--teal);font-weight:800;background:var(--teal-soft);border-radius:6px;padding:1px 7px}
.hl{background:#ffe08a;border-radius:5px;padding:0 3px;box-shadow:0 0 0 2px #ffe08a}
.hl2{background:#bfe3ff;border-radius:5px;padding:0 3px;box-shadow:0 0 0 2px #bfe3ff}
.hl3{background:#c9f2d4;border-radius:5px;padding:0 3px;box-shadow:0 0 0 2px #c9f2d4}
.red{color:var(--bad);font-weight:800}.blue{color:var(--pri);font-weight:800}.green{color:var(--ok);font-weight:800}.pur{color:var(--pur);font-weight:800}.org{color:#c2410c;font-weight:800}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease}
.fadein{animation:fadeUp .5s ease}
.tr{transition:transform .9s cubic-bezier(.5,.1,.3,1),opacity .6s,fill .5s}

/* practice */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:.85em;font-weight:700;color:var(--ink)}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.modebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modebar .mode{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:800}
.modebar .mode.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.score{margin-left:auto;font-weight:800;color:var(--muted);font-size:.92em}
.score b{color:var(--ok)}
.qcard{border:2px solid var(--line);border-radius:16px;padding:18px;background:#fff;margin-top:10px}
.qcard .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-weight:800;font-size:.85em;margin-bottom:8px}
.qcard .qtype{background:var(--pur-soft);color:var(--pur);border-radius:8px;padding:2px 9px}
.qcard .qtext{font-size:1.18em;line-height:1.6}
.qcard .qtext .big{font-size:1.25em;display:block;margin:.4em 0;text-align:center}
.qfig{display:flex;justify-content:center;margin:8px 0;overflow-x:auto}
.ans{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;font-size:1.15em}
.ans input{font-size:1.05em;padding:8px 12px;border:2px solid var(--line);border-radius:10px;width:170px;font-family:inherit}
.ans input:focus{outline:none;border-color:var(--pri)}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:800;background:var(--pri);color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.go{background:var(--ok)}
.mcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:12px}
.mcs button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;font-size:1.08em;display:flex;gap:10px;align-items:center}
.mcs button .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-weight:900;font-size:.85em;color:var(--muted)}
.mcs button:hover{border-color:#a9c0f5}
.mcs button.right{border-color:var(--ok);background:var(--ok-soft)}
.mcs button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mcs button:disabled{cursor:default}
.fb{margin-top:12px;border-radius:12px;padding:10px 14px;font-weight:700;display:none}
.fb.ok{display:block;background:var(--ok-soft);color:#11612e}
.fb.no{display:block;background:var(--bad-soft);color:#8f1d1d}
.qbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sol{display:none;margin-top:12px;border-left:4px solid var(--teal);background:var(--teal-soft);border-radius:0 12px 12px 0;padding:10px 14px}
.sol.show{display:block;animation:fadeUp .35s}
.sol ol{margin:4px 0;padding-left:22px}
.sol li{margin:6px 0}
.sol .st{font-size:1.08em}
.hintbox{display:none;margin-top:10px;background:var(--acc-soft);border-radius:10px;padding:8px 12px}
.hintbox.show{display:block}
.result{text-align:center;padding:20px}
.result .stars{font-size:2.4em;letter-spacing:.1em}
.result .big{font-size:2.4em;font-weight:900}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 0}
.prog i{display:block;height:100%;background:var(--ok);transition:width .4s}

/* home */
.hero{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:20px;padding:26px 24px;margin-top:6px}
.hero h1{color:#fff}
.hero .zh{color:#e9e5ff}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.howto>div{background:rgba(255,255,255,.14);border-radius:14px;padding:12px 14px}
.howto b{font-size:1.4em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.chcard{cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:transform .15s}
.chcard:hover{transform:translateY(-2px);border-color:#b8c8ee}
.chcard .chnum{width:46px;height:46px;font-size:1.25em}

/* tables */
table.t{border-collapse:collapse;margin:8px auto;font-size:1em;background:#fff}
table.t td,table.t th{border:1.5px solid #b9c4d4;padding:5px 12px;text-align:center}
table.t th{background:#eef2f8}
table.sl{border-collapse:collapse;margin:6px auto;font-size:1.15em;font-family:"Courier New",monospace}
table.sl td{padding:2px 8px}
table.sl td.stem{border-right:2.5px solid var(--ink);text-align:right;font-weight:800}
table.sl td.stemc{border-left:2.5px solid var(--ink);border-right:2.5px solid var(--ink);text-align:center;font-weight:800}
table.sl td.lv{text-align:left;letter-spacing:.35em}
table.sl td.lvl{text-align:right;letter-spacing:.35em}
table.sl th{font-family:"Nunito",sans-serif;font-size:.8em;padding:2px 8px;color:var(--muted)}

/* final page */
.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}
.cheat .card{margin:0}
.cheat h3{display:flex;gap:8px;align-items:center}
.cheat h3 .chnum{width:30px;height:30px;font-size:.85em;border-radius:8px}
.cheat ul{margin:4px 0;padding-left:20px}
.cheat li{margin:4px 0}
.checklist li{list-style:none;margin:6px 0}
.checklist{padding-left:0}
.checklist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checklist input{width:20px;height:20px;margin-top:3px;flex:none}
.foot{color:var(--muted);font-size:.85em;text-align:center;margin-top:30px}
@media (max-width:640px){
  body{font-size:16px}
  .secnav{position:static;gap:6px}
  .secnav button{padding:5px 10px;font-size:.88em}
  .topin{flex-wrap:nowrap;padding:8px 10px;gap:8px}
  .brand{font-size:.92em}.brand .logo{width:28px;height:28px}
  .langs button{padding:4px 7px;font-size:.74em}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
  .chips button{flex:none}
  .modebar .mode{padding:6px 10px;font-size:.88em}
  .chhead .chnum{width:44px;height:44px;font-size:1.2em}
  h1{font-size:1.4em}
  .work{font-size:1.12em}
  .anim .ctrl button.play{min-width:70px}
  .qcard{padding:14px}
}
@media print{
  header.top,.secnav,.noprint{display:none !important}
  body{background:#fff;font-size:12px}
  .card{box-shadow:none;break-inside:avoid}
}

.pagetabs{display:flex;gap:6px;margin:14px 0 6px;border-bottom:2px solid var(--line)}
.pagetabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-weight:800;padding:10px 8px;border-radius:12px 12px 0 0;border:2px solid transparent;border-bottom:0;margin-bottom:-2px;background:transparent}
.pagetabs a .pn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink);font-size:.8em;margin-right:6px}
.pagetabs a.on{color:var(--pri);background:#fff;border-color:var(--line);border-bottom:2px solid #fff}
.pagetabs a.on .pn{background:var(--pri);color:#fff}
.pagenext{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:22px 0 6px}
.pagenext .btn{text-decoration:none;display:inline-block}
.pagenext .btn.go{margin-left:auto}
@media (max-width:640px){.pagetabs a{padding:8px 4px;font-size:.85em}.pagetabs a .pn{display:none}}

</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand"><span class="logo">S1</span><span>Maths Revision <span style="font-weight:700">數學溫習</span></span></div>
    <div class="langs"><button data-l="both">EN + 中</button><button data-l="en">EN</button><button data-l="zh">中文</button></div>
  </div>
  <nav class="tabs"></nav>
</header>
<main></main>
<script>
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const nz = (a, b) => { let x; do x = ri(a, b); while (x === 0); return x; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
const MI = '−';
const rnd = x => Math.round(x * 1e9) / 1e9;
/* number → text with a proper minus sign */
const n = x => { x = rnd(x); return x < 0 ? MI + Math.abs(x) : '' + x; };
/* negative numbers in brackets: (−3) */
const nb = x => x < 0 ? '(' + n(x) + ')' : n(x);
const pb = x => '(' + n(x) + ')';
/* directed number with sign in brackets: (+3) (−3) */
const sg = x => '(' + (x < 0 ? MI : '+') + Math.abs(rnd(x)) + ')';
const v = s => `<i class="v">${s}</i>`;
const fr = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const L = (en, zh) => en === zh ? `<span>${en}</span>` : `<span class="en">${en}</span><span class="zh">${zh}</span>`;
const B = (en, zh) => en === zh ? `<div class="blk"><span>${en}</span></div>` : `<div class="blk"><span class="en">${en}</span><span class="zh">${zh}</span></div>`;
const T = (en, zh) => `<span class="term">${en}<span class="tz">${zh}</span></span>`;
const box = (kind, title, html) => `<div class="box ${kind}">${title ? `<div class="bt">${title}</div>` : ''}${html}</div>`;
const ul = items => `<ul class="explain">${items.map(i => `<li>${i}</li>`).join('')}</ul>`;

/* ================= Fractions ================= */
class F {
  constructor(a, b = 1) { if (b < 0) { a = -a; b = -b; } const g = gcd(a, b); this.n = a / g; this.d = b / g; if (this.n === 0) this.n = 0; }
  static of(x) {
    if (x instanceof F) return x;
    if (Number.isInteger(x)) return new F(x, 1);
    const s = String(rnd(x)); const k = (s.split('.')[1] || '').length; const p = 10 ** k;
    return new F(Math.round(x * p), p);
  }
  add(o) { o = F.of(o); return new F(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { o = F.of(o); return new F(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { o = F.of(o); return new F(this.n * o.n, this.d * o.d); }
  div(o) { o = F.of(o); return new F(this.n * o.d, this.d * o.n); }
  eq(o) { o = F.of(o); return this.n === o.n && this.d === o.d; }
  get val() { return this.n / this.d; }
  get isInt() { return this.d === 1; }
  /* html: improper fraction by default; mixed=true gives mixed number */
  html(mixed = false) {
    if (this.d === 1) return n(this.n);
    const s = this.n < 0 ? MI : ''; const a = Math.abs(this.n);
    if (mixed && a > this.d) { const w = Math.floor(a / this.d), r = a % this.d; return `<span class="mixed">${s}${w}${fr(r, this.d)}</span>`; }
    return s + fr(a, this.d);
  }
  hb(mixed) { return this.n < 0 ? '(' + this.html(mixed) + ')' : this.html(mixed); }
  text() { return this.d === 1 ? n(this.n) : n(this.n) + '/' + this.d; }
}
const frh = (a, b, mixed) => new F(a, b).html(mixed);
const rawfr = (a, b) => (a < 0 ? MI : '') + fr(Math.abs(a), b); /* not simplified */

/* ================= Algebra formatting ================= */
const SUP = { 2: '<sup>2</sup>' };
const pw = (b, e) => e === 1 ? b : e === 0 ? '' : `${b}<sup>${e}</sup>`;
/* one term: coefficient c (number or F) with vars like {x:2,y:1}; first=true means no leading + */
function termH(c, vars = {}, first = false) {
  const cf = F.of(c);
  if (cf.n === 0) return '';
  const vs = Object.entries(vars).filter(([, e]) => e !== 0).map(([k, e]) => pw(v(k), e)).join('');
  const neg = cf.n < 0; const a = neg ? new F(-cf.n, cf.d) : cf;
  let body;
  if (vs && a.n === 1 && a.d === 1) body = vs;
  else body = a.html() + vs;
  if (first) return (neg ? MI : '') + body;
  return (neg ? ` ${MI} ` : ' + ') + body;
}
/* polynomial from list of [c, vars] in given order */
function polyH(terms) {
  let out = ''; let first = true;
  for (const [c, vars] of terms) { if (F.of(c).n === 0) continue; out += termH(c, vars, first); first = false; }
  return out || '0';
}

/* helper to build multiple-choice numeric distractors */
function numChoices(ans, wrongs) {
  const a = F.of(ans); const out = [a.html()]; const seen = new Set([a.text()]);
  for (const w of wrongs) { const f = F.of(w); if (!seen.has(f.text())) { seen.add(f.text()); out.push(f.html()); } if (out.length >= 4) break; }
  let k = 1; while (out.length < 4) { const f = a.add(k * (k % 2 ? 1 : -1)); if (!seen.has(f.text())) { seen.add(f.text()); out.push(f.html()); } k++; }
  return out;
}

const PAL = ['#3b82f6', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#14b8a6', '#f97316'];
function axes(W, H, m, maxV, step, ylabel) {

    const py = H - m.b - (y / maxV) * (H - m.t - m.b);
    s += `<line x1="${m.l}" y1="${py}" x2="${W - m.r}" y2="${py}" stroke="#e3e8f0"/><text x="${m.l - 6}" y="${py + 4}" text-anchor="end" font-size="12" fill="#475569">${y}</text>`;
  }

  if (ylabel) s += `<text x="14" y="${(H - m.b + m.t) / 2}" transform="rotate(-90 14 ${(H - m.b + m.t) / 2})" text-anchor="middle" font-size="12" fill="#334155">${ylabel}</text>`;

}
function barChart({ title, labels, values, step, ylabel, xlabel, color = PAL[0] }) {

  });

}
function compBar({ title, labels, series, step, ylabel, xlabel }) {

  /* ----- generators ----- */
  const isMixed = () => Math.random() < .35;
  function fracOpnd() { const b = pick([2, 3, 4, 5, 6, 8, 9, 10, 12]); let a; do a = ri(1, b - 1); while (gcd(a, b) !== 1); const w = isMixed() ? ri(1, 3) : 0; return { f: new F(w * b + a, b), w, a, b, h: w ? `${w}${fr(a, b)}` : fr(a, b) }; }
  function convStep(o) { return o.w ? `${L('Change mixed fraction', '帶分數化假分數')}: ${o.h} = ${fr(`${o.w} × ${o.b} + ${o.a}`, o.b)} = ${fr(o.w * o.b + o.a, o.b)}` : null; }

  const gens = [
    {
      id: 'int', name: ['Mixed operations (integers)', '整數四則混合運算'], gen() {
        const t = ri(0, 5); let q, s = [], ans;
        if (t === 0) { const a = ri(5, 40), b = ri(2, 9), c = ri(2, 9); q = `${a} + ${b} × ${c}`; ans = a + b * c; s = [L('No brackets. Do × first', '沒有括號，先計 ×') + `: ${b} × ${c} = ${b * c}`, `${a} + ${b * c} = <b>${ans}</b>`]; }
        if (t === 1) { const a = ri(2, 15), b = ri(2, 15), c = ri(2, 6); q = `(${a} + ${b}) × ${c}`; ans = (a + b) * c; s = [L('Brackets first', '先計括號') + `: ${a} + ${b} = ${a + b}`, `${a + b} × ${c} = <b>${ans}</b>`]; }
        if (t === 2) { const c = ri(2, 9), k = ri(2, 9), b = c * k, a = ri(k + 1, 50); q = `${a} − ${b} ÷ ${c}`; ans = a - k; s = [L('Do ÷ before −', '先計 ÷ 再計 −') + `: ${b} ÷ ${c} = ${k}`, `${a} − ${k} = <b>${ans}</b>`]; }
        if (t === 3) { const a = ri(3, 12), b = ri(3, 9), c = ri(2, 6), d = ri(2, 5); if (a * b <= c * d) return null; q = `${a} × ${b} − ${c} × ${d}`; ans = a * b - c * d; s = [L('Do both × first', '先計兩個 ×') + `: ${a} × ${b} = ${a * b}, ${c} × ${d} = ${c * d}`, `${a * b} − ${c * d} = <b>${ans}</b>`]; }
        if (t === 4) { const c = ri(2, 6), k = ri(2, 9), b = ri(1, 20), a = b + c * k, d = ri(1, 20); q = `(${a} − ${b}) ÷ ${c} + ${d}`; ans = k + d; s = [L('Brackets first', '先計括號') + `: ${a} − ${b} = ${a - b}`, L('Then ÷', '然後 ÷') + `: ${a - b} ÷ ${c} = ${k}`, `${k} + ${d} = <b>${ans}</b>`]; }
        if (t === 5) { const b = ri(2, 6), k = ri(2, 8), a = b * k, c = ri(2, 6); q = `${a} ÷ ${b} × ${c}`; ans = k * c; s = [L('÷ and × are the same level → left to right', '÷ 和 × 同級 → 由左至右') + `: ${a} ÷ ${b} = ${k}`, `${k} × ${c} = <b>${ans}</b>`]; }
        return { kind: 'num', q: L('Evaluate', '計算') + `<span class="big">${q}</span>`, ans, steps: s, hint: L('Brackets → × ÷ → + −', '括號 → × ÷ → + −') };
      }
    },
    {
      id: 'fadd', name: ['Fractions + −', '分數加減'], gen() {
        const X = fracOpnd(), Y = fracOpnd(); if (X.b === Y.b && Math.random() < .7) return null;
        let op = pick(['+', '−']); let A = X, Bb = Y; if (op === '−' && X.f.val <= Y.f.val) { A = Y; Bb = X; }
        const res = op === '+' ? A.f.add(Bb.f) : A.f.sub(Bb.f); const m = lcm(A.f.d, Bb.f.d);
        const s = []; [A, Bb].forEach(o => { const c = convStep(o); if (c) s.push(c); });
        const an = A.f.n * m / A.f.d, bn = Bb.f.n * m / Bb.f.d;
        if (A.f.d !== Bb.f.d) s.push(L(`Common denominator = L.C.M. of ${A.f.d} and ${Bb.f.d} = ${m}`, `公分母 = ${A.f.d} 和 ${Bb.f.d} 的 L.C.M. = ${m}`));
        s.push(`${fr(an, m)} ${op} ${fr(bn, m)} = ${fr(op === '+' ? an + bn : an - bn, m)}`);
        if (res.d !== m || Math.abs(res.n) >= res.d) s.push(L('Simplify', '化簡') + `: = <b>${res.html(true)}</b>`);
        return { kind: 'num', q: L('Evaluate (simplest form).', '計算（最簡形式）。') + `<span class="big">${A.h} ${op} ${Bb.h}</span>`, ans: res, mixed: true, steps: s, hint: L('Make the denominators the same first.', '先令分母相同。') };
      }
    },
    {
      id: 'fmul', name: ['Fractions × ÷', '分數乘除'], gen() {
        const X = fracOpnd(), Y = fracOpnd(); const op = pick(['×', '÷']);
        const res = op === '×' ? X.f.mul(Y.f) : X.f.div(Y.f);
        const s = []; [X, Y].forEach(o => { const c = convStep(o); if (c) s.push(c); });
        if (op === '÷') s.push(L('÷ → × and flip the second fraction', '÷ 變 ×，第二個分數倒轉') + `: ${X.f.html()} × ${fr(Y.f.d, Y.f.n)}`);
        const p = op === '×' ? Y.f : new F(Y.f.d, Y.f.n);
        s.push(L('Top × top, bottom × bottom', '分子乘分子，分母乘分母') + `: ${fr(`${X.f.n} × ${p.n}`, `${X.f.d} × ${p.d}`)} = ${rawfr(X.f.n * p.n, X.f.d * p.d)}`);
        s.push(L('Simplify', '化簡') + `: = <b>${res.html(true)}</b>`);
        return { kind: 'num', q: L('Evaluate (simplest form).', '計算（最簡形式）。') + `<span class="big">${X.h} ${op} ${Y.h}</span>`, ans: res, mixed: true, steps: s, hint: op === '÷' ? L('Keep, change, flip!', '不變、變乘、倒轉！') : L('Change mixed fractions to improper fractions first.', '先把帶分數化成假分數。') };
      }
    },
    {
      id: 'fmix', name: ['Fractions: mixed operations', '分數四則混合運算'], gen() {
        const b = pick([2, 3, 4, 5, 6]), d = pick([2, 3, 4, 5]), f = pick([2, 3, 4, 5, 6]);
        const A = new F(ri(1, b - 1), b), Bf = new F(ri(1, d - 1), d), C = new F(ri(1, f + 2), f);
        const t = ri(0, 1); let q, res, s;
        if (t === 0) { const pr = Bf.mul(C); res = A.add(pr); q = `${A.html()} + ${Bf.html()} × ${C.html()}`; s = [L('Do × first', '先計 ×') + `: ${Bf.html()} × ${C.html()} = ${pr.html()}`, `${A.html()} + ${pr.html()} = <b>${res.html(true)}</b>`]; }
        else { if (A.val <= Bf.val) return null; const df = A.sub(Bf); res = df.div(C); q = `(${A.html()} − ${Bf.html()}) ÷ ${C.html()}`; s = [L('Brackets first', '先計括號') + `: ${A.html()} − ${Bf.html()} = ${df.html()}`, L('÷ → × flip', '÷ 變 × 並倒轉') + `: ${df.html()} × ${fr(C.d, C.n)} = <b>${res.html(true)}</b>`]; }
        return { kind: 'num', q: L('Evaluate (simplest form).', '計算（最簡形式）。') + `<span class="big">${q}</span>`, ans: res, mixed: true, steps: s, hint: L('Brackets → × ÷ → + −', '括號 → × ÷ → + −') };
      }
    },
    {
      id: 'dec', name: ['Decimals + −', '小數加減'], gen() {
        const a = ri(10, 199) / 10, b = ri(10, 999) / 100, c = ri(1, 50) / 10; const t = ri(0, 2); let q, ans, s;
        if (t === 0) { q = `${a} + ${b}`; ans = rnd(a + b); s = [L('Line up the decimal points', '小數點對齊') + `: ${a.toFixed(2)} + ${b.toFixed(2)}`, `= <b>${ans}</b>`]; }
        if (t === 1) { if (a <= b) return null; q = `${a} − ${b}`; ans = rnd(a - b); s = [L('Line up the decimal points; fill empty places with 0', '小數點對齊，空位補 0') + `: ${a.toFixed(2)} − ${b.toFixed(2)}`, `= <b>${ans}</b>`]; }
        if (t === 2) { if (a + c <= b) return null; q = `${a} − ${b} + ${c}`; ans = rnd(a - b + c); s = [L('Left to right', '由左至右') + `: ${a} − ${b} = ${rnd(a - b)}`, `${rnd(a - b)} + ${c} = <b>${ans}</b>`]; if (a < b) return null; }
        return { kind: 'num', q: L('Evaluate', '計算') + `<span class="big">${q}</span>`, ans, steps: s, hint: L('Line up the decimal points.', '小數點要對齊。') };

    },
    {
      id: 'decmul', name: ['Decimals × ÷', '小數乘除'], gen() {
        if (Math.random() < .5) {
          const a = ri(11, 99) / 10, b = pick([ri(2, 9) / 10, ri(11, 49) / 10, ri(2, 9)]); const ans = rnd(a * b);
          const da = (String(a).split('.')[1] || '').length, db = (String(b).split('.')[1] || '').length;
          const ia = Math.round(a * 10 ** da), ib = Math.round(b * 10 ** db);

        }

    {
      id: 'conv', name: ['Fraction ↔ decimal', '分數與小數互換'], gen() {
        if (Math.random() < .5) {
          const d = pick([2, 4, 5, 8, 10, 20, 25, 50]); const a = ri(1, d - 1); const f = new F(a, d); if (f.d === 1) return null;

        }

        const tot = pick([24, 30, 36, 40, 48, 60]); const f1 = pick([new F(1, 2), new F(1, 3), new F(1, 4), new F(1, 6), new F(2, 3), new F(3, 4), new F(5, 6)]); const used = f1.mul(tot); if (!used.isInt) return null;

        const R = padd(P, Q, sub ? -1 : 1); if (!R[2]) return null;

        const wr = sub ? [px(half), px(padd(P, Q, 1)), px({ 2: R[2], 1: R[1], 0: -R[0] })] : [px(padd(P, Q, -1)), px({ 2: R[2], 1: -R[1], 0: R[0] }), px({ 2: P[2] * Q[2], 1: R[1], 0: R[0] })];

        if (t === 1) { const a = pick([2, 3, 4]), b = pick([2, 3, 4, 5, 6]); if (a === b) return null; const m = lcm(a, b); const x = m * nz(-3, 4); const p = nz(-6, 6); const c = x / a + p - x / b; if (c === 0) return null;

        const a = pick([2, 3, 4, 5]), b = pick([2, 3, 4, 5]); if (a === b) return null; const x = nz(-10, 12), p = nz(-8, 8); const q = (b * (x + p)) / a - x; if (!Number.isInteger(q) || q === 0) return null;
        return { kind: 'num', pre: X + ' =', q: L('Solve', '解方程') + `<span class="big">${fr(lin(1, p), a)} = ${fr(lin(1, q), b)}</span>`, ans: x,

  const b2bAnim = () => W(L('Back-to-back stem-and-leaf diagram', '背對背幹葉圖'), [

  const lessons = [

  /* ------- generators ------- */
  const CATS = [
    ['Favourite fruit', '最喜愛的水果', [['Apple', '蘋果'], ['Orange', '橙'], ['Banana', '香蕉'], ['Grape', '提子'], ['Mango', '芒果']]],

  const catName = c => lb(c[0], c[1]);
  const gens = [
    {
      id: 'bar', name: ['Bar charts', '棒形圖'], gen() {
        const [te, tz, cs] = pick(CATS); const k = ri(4, 5); const cats = cs.slice(0, k); const step = pick([2, 5]); const vals = cats.map(() => ri(1, 8) * step);

        const t = ri(0, 3); const i = ri(0, k - 1); let j; do j = ri(0, k - 1); while (j === i);
        if (t === 0) return { kind: 'num', fig, q: L(`How many students chose ${cats[i][0]}?`, `有多少名學生選擇${cats[i][1]}？`), ans: vals[i], steps: [L(`Find the bar for ${cats[i][0]} and read across to the vertical axis.`, `找出「${cats[i][1]}」的棒，橫向讀出直軸上的數值。`), `<b>${vals[i]}</b>`] };
        if (t === 1) { if (vals[i] === vals[j]) return null; const [a, b] = vals[i] > vals[j] ? [i, j] : [j, i];

        const mx = Math.max(...vals); if (vals.filter(x => x === mx).length > 1) return null; const im = vals.indexOf(mx);
        return { kind: 'mc', fig, q: L('Which is the most popular?', '哪一項最受歡迎？'), choices: [catName(cats[im]), ...cats.filter((_, x) => x !== im).map(catName)], steps: [L('Most popular = the tallest bar.', '最受歡迎 = 最高的棒。'), `<b>${catName(cats[im])}</b> (${mx})`] };

    {

        const t = ri(0, 2); const i = ri(0, 3);
        if (t === 0) { const N = pick([36, 72, 120, 180, 360, 240, 60, 90]); const cnt = angles[i] * N / 360; if (!Number.isInteger(cnt)) return null;
          return { kind: 'num', fig: pieChart({ title: `${lb(te, tz)} (${N} ${lb('students', '名學生')})`, labels: labs, angles }), q: L(`${N} students were asked. How many chose ${cats[i][0]}?`, `共訪問了 ${N} 名學生。有多少人選擇${cats[i][1]}？`), ans: cnt, steps: [L('Number = angle ÷ 360° × total', '人數 = 角度 ÷ 360° × 總數'), `${fr(angles[i] + '°', '360°')} × ${N} = <b>${cnt}</b>`] }; }

        const pc = angles[i] / 360 * 100; if (!Number.isInteger(pc * 10)) return null;

    {
      id: 'line', name: ['Broken-line graphs', '折線圖'], gen() {
        const ms = LANG === 'zh' ? ['1月', '2月', '3月', '4月', '5月', '6月'] : ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun']; const step = pick([5, 10]); const vals = ms.map(() => ri(2, 9) * step);
        const fig = lineChart({ title: lb('Number of visitors (hundreds)', '訪客人數（百人）'), labels: ms, values: vals, step }); const t = ri(0, 2);
        if (t === 0) { const i = ri(0, 4); const d = vals[i + 1] - vals[i]; if (d === 0) return null;

        if (t === 1) { const mx = Math.max(...vals); if (vals.filter(x => x === mx).length > 1) return null; const im = vals.indexOf(mx);
          return { kind: 'mc', fig, q: L('In which month was the number of visitors the greatest?', '哪一個月的訪客最多？'), choices: [ms[im], ...shuffle(ms.filter((_, k) => k !== im)).slice(0, 3)], steps: [L('Greatest = the highest point.', '最多 = 最高的點。'), `<b>${ms[im]}</b> (${mx})`] }; }
        const inc = vals.slice(1).map((x, k) => x - vals[k]); const mx = Math.max(...inc); if (mx <= 0 || inc.filter(x => x === mx).length > 1) return null; const k = inc.indexOf(mx);
        return { kind: 'mc', fig, q: L('Between which two months was the INCREASE the greatest?', '哪兩個月之間的升幅最大？'), choices: inc.map((_, j) => `${ms[j]} → ${ms[j + 1]}`).filter((_, j) => j !== k).slice(0, 3).reduce((a, x) => a.concat(x), [`${ms[k]} → ${ms[k + 1]}`]), steps: [L('The steepest line going UP.', '向上最斜的線段。'), `${ms[k]} → ${ms[k + 1]}: ${vals[k + 1]} − ${vals[k]} = <b>${mx}</b>`] };

    },
    {
      id: 'comp', name: ['Two sets of data', '兩組數據'], gen() {
        const cl = ['1A', '1B', '1C', '1D']; const bo = cl.map(() => ri(12, 20)), gi = cl.map(() => ri(12, 20));
        const fig = compBar({ title: lb('Students in S1 classes', '中一各班人數'), labels: cl, series: [{ name: lb('Boys', '男'), values: bo, color: '#3b82f6' }, { name: lb('Girls', '女'), values: gi, color: '#f472b6' }], step: 4 });
        const i = ri(0, 3); const t = ri(0, 2);
        if (t === 0) return { kind: 'num', fig, q: L(`How many students are there in ${cl[i]}?`, `${cl[i]} 班有多少名學生？`), ans: bo[i] + gi[i], steps: [`${L('Boys', '男生')} ${bo[i]} + ${L('girls', '女生')} ${gi[i]} = <b>${bo[i] + gi[i]}</b>`] };
        if (t === 1) { if (bo[i] === gi[i]) return null; return { kind: 'num', fig, q: L(`In ${cl[i]}, what is the difference between the number of boys and girls?`, `${cl[i]} 班男生和女生人數相差多少？`), ans: Math.abs(bo[i] - gi[i]), steps: [`${Math.max(bo[i], gi[i])} − ${Math.min(bo[i], gi[i])} = <b>${Math.abs(bo[i] - gi[i])}</b>`] }; }
        const tb = bo.reduce((a, b) => a + b); return { kind: 'num', fig, q: L('How many boys are there in S1 altogether?', '中一共有多少名男生？'), ans: tb, steps: [L('Add the blue bars', '把藍色的棒相加') + `: ${bo.join(' + ')} = <b>${tb}</b>`] };
      }
    },
    {
      id: 'disc', name: ['Discrete or continuous', '離散或連續'], gen() {
        const D = [['the number of students in a class', '一班的學生人數'], ['the number of goals in a match', '一場比賽的入球數目'], ['the number of pets at home', '家中寵物的數目'], ['the number of cars in a car park', '停車場內汽車的數目'], ['the number of red cards in a pack', '一副牌中紅色牌的數目'], ['the shoe size of students', '學生的鞋碼'], ['the number of questions answered correctly', '答對題目的數目']];
        const C = [['the height of a student', '學生的身高'], ['the weight of a bag of rice', '一包米的重量'], ['the time taken to finish a race', '完成比賽所需的時間'], ['the temperature of a room', '房間的溫度'], ['the length of a pencil', '鉛筆的長度'], ['the volume of water in a bottle', '樽內水的容量']];
        const isD = Math.random() < .5; const it = pick(isD ? D : C);
        return { kind: 'mc', keep: 1, q: L(`Is “${it[0]}” discrete data or continuous data?`, `「${it[1]}」是離散數據還是連續數據？`), choices: isD ? [T('Discrete data', '離散數據'), T('Continuous data', '連續數據')] : [T('Continuous data', '連續數據'), T('Discrete data', '離散數據')],
          steps: [isD ? L('It is COUNTED → discrete.', '它是數出來的 → 離散數據。') : L('It is MEASURED → continuous.', '它是量度出來的 → 連續數據。')], hint: L('Counted → discrete. Measured → continuous.', '數出來 → 離散；量度出來 → 連續。') };

    {
      id: 'freq', name: ['Frequency tables', '頻數分佈表'], gen() {
        const N = ri(16, 24); const data = [...Array(N)].map(() => pick([0, 1, 1, 2, 2, 2, 3, 3, 4, 5]));

        const k = ri(2, 4); const ans = cnt.slice(k).reduce((a, b) => a + b);

    },
    {
      id: 'gfreq', name: ['Grouped frequency tables', '分組頻數分佈表'], gen() {
        const N = ri(15, 20); const data = [...Array(N)].map(() => ri(40, 99)); const groups = [40, 50, 60, 70, 80, 90];
        const cnt = groups.map(g => data.filter(x => x >= g && x <= g + 9).length);
        const raw = `<div style="font-family:monospace;font-size:1.05em;letter-spacing:1px;max-width:480px;text-align:center">${data.join(' &nbsp;')}</div>`;
        const table = `<table class="t"><tr><th>${L('Marks', '分數')}</th>${groups.map(g => `<td>${g}–${g + 9}</td>`).join('')}</tr><tr><th>${L('Frequency', '頻數')}</th>${cnt.map(c => `<td>${c}</td>`).join('')}</tr></table>`;
        if (Math.random() < .5) { const i = ri(0, 5); const g = groups[i];
          return { kind: 'num', fig: raw, q: L(`The test marks of ${N} students are shown. How many students scored ${g}–${g + 9}?`, `以下是 ${N} 名學生的測驗分數。有多少名學生的分數在 ${g}–${g + 9} 之間？`), ans: cnt[i], steps: [L(`Count the marks from ${g} to ${g + 9}: `, `點算 ${g} 至 ${g + 9} 的分數：`) + (data.filter(x => x >= g && x <= g + 9).join(', ') || L('none', '沒有')), table, `<b>${cnt[i]}</b>`] }; }
        const g = pick([60, 70, 80]); const ans = data.filter(x => x >= g).length;
        return { kind: 'num', fig: table, q: L(`The table shows the test marks of ${N} students. How many students scored ${g} marks or above?`, `下表顯示 ${N} 名學生的測驗分數。有多少名學生得 ${g} 分或以上？`), ans, steps: [L(`Add the groups from ${g}–${g + 9} upwards`, `把 ${g}–${g + 9} 及以上各組相加`) + `: ${cnt.slice(groups.indexOf(g)).join(' + ')} = <b>${ans}</b>`] };
      }
    },
    {
      id: 'stem', name: ['Stem-and-leaf diagrams', '幹葉圖'], gen() {
        const N = ri(12, 18); const lo = pick([3, 4, 5]); const data = [...Array(N)].map(() => ri(lo * 10, lo * 10 + 39)); const fig = stemLeaf(data) + `<div class="sub" style="text-align:center;font-size:.85em">${L(`Key: ${lo} | 2 means ${lo}2`, `代號：${lo} | 2 表示 ${lo}2`)}</div>`;
        const s = data.slice().sort((a, b) => a - b); const t = ri(0, 3); const wrap = `<div>${fig}</div>`;
        if (t === 0) return { kind: 'num', fig: wrap, q: L('The diagram shows the weights (kg) of some students. What is the heaviest weight?', '幹葉圖顯示一些學生的體重（kg）。最重的是多少？'), post: 'kg', ans: s[N - 1], steps: [L('Heaviest: the LAST leaf on the BOTTOM stem.', '最重：最下面一行的最後一片葉。'), `<b>${s[N - 1]} kg</b>`] };
        if (t === 1) return { kind: 'num', fig: wrap, q: L('The diagram shows the weights (kg) of some students. What is the lightest weight?', '幹葉圖顯示一些學生的體重（kg）。最輕的是多少？'), post: 'kg', ans: s[0], steps: [L('Lightest: the FIRST leaf on the TOP stem.', '最輕：最上面一行的第一片葉。'), `<b>${s[0]} kg</b>`] };
        if (t === 2) return { kind: 'num', fig: wrap, q: L('How many students are there?', '共有多少名學生？'), ans: N, steps: [L('Count ALL the leaves.', '數一數所有的葉。'), `<b>${N}</b>`] };
        const k = lo * 10 + ri(10, 30); const ans = data.filter(x => x > k).length;
        return { kind: 'num', fig: wrap, q: L(`The diagram shows the weights (kg) of some students. How many students are heavier than ${k} kg?`, `幹葉圖顯示一些學生的體重（kg）。有多少名學生重於 ${k} kg？`), ans, steps: [L(`Count the leaves for numbers MORE than ${k} (not equal).`, `點算大於 ${k} 的數（不包括等於）。`), `${s.filter(x => x > k).join(', ') || L('none', '沒有')}`, `<b>${ans}</b>`] };
      }
    },
    {
      id: 'stem2', name: ['Back-to-back stem-and-leaf', '背對背幹葉圖'], gen() {
        const A = [...Array(ri(8, 11))].map(() => ri(50, 89)), Bd = [...Array(ri(8, 11))].map(() => ri(55, 99));
        const fig = `<div>${stemLeaf2(A, Bd, lb('Class A', '甲班'), lb('Class B', '乙班'))}<div class="sub" style="text-align:center;font-size:.85em">${L('Key: 3 | 6 means 63 for Class A; 6 | 3 means 63 for Class B', '代號：甲班 3 | 6 表示 63；乙班 6 | 3 表示 63')}</div></div>`;
        const t = ri(0, 2);
        if (t === 0) { const mx = Math.max(...A); return { kind: 'num', fig, q: L('What is the highest mark in Class A (the LEFT side)?', '甲班（左邊）的最高分是多少？'), ans: mx, steps: [L('Left side: find the LOWEST row that has leaves on the left, then take the leaf FURTHEST from the stem.', '左邊：找出左邊有葉的最下一行，取離幹最遠的葉。'), L('Remember: stem first, then leaf.', '記住：先讀幹，再讀葉。') + ` → <b>${mx}</b>`] }; }
        if (t === 1) { const k = pick([60, 70, 80]); const ans = Bd.filter(x => x >= k).length; return { kind: 'num', fig, q: L(`How many students in Class B scored ${k} or more?`, `乙班有多少名學生得 ${k} 分或以上？`), ans, steps: [L(`Right side: count leaves on stems ${k / 10} and above.`, `右邊：點算幹 ${k / 10} 及以上的葉。`), `<b>${ans}</b>`] }; }
        const mn = Math.min(...A); return { kind: 'num', fig, q: L('What is the lowest mark in Class A (the LEFT side)?', '甲班（左邊）的最低分是多少？'), ans: mn, steps: [L('Left side: find the HIGHEST row that has leaves on the left, then take the leaf NEXT to the stem.', '左邊：找出左邊有葉的最上一行，取最貼近幹的葉。'), `<b>${mn}</b>`] };
      }
    }
  ];

  CH.push({
    id: 'ch8', no: 8, color: COLORS[8], title: ['Statistics (I)', '統計（一）'], short: ['Statistics', '統計'],
    intro: ['Reading statistical diagrams, types of data, frequency tables and stem-and-leaf diagrams.', '閱讀統計圖表、數據的分類、頻數分佈表和幹葉圖。'],
    lessons, gens,
    keys: [B('Bar chart → compare; pie chart → parts of a whole; broken-line graph → change over time.', '棒形圖 → 比較；圓形圖 → 整體中的部分；折線圖 → 隨時間的變化。'),
    B('Pie chart: number = angle/360° × total. All angles add up to 360°.', '圓形圖：數量 = 角度/360° × 總數；所有角度加起來是 360°。'),
    B('Discrete = counted. Continuous = measured.', '離散 = 數出來；連續 = 量度出來。'),
    B('Total frequency = number of data.', '頻數總和 = 數據的數目。'),
    B('Stem-and-leaf: leaves in order, add a key. Back-to-back: left side read right to left (3 | 5 → 53).', '幹葉圖：葉要排序，要寫代號。背對背：左邊由右至左讀（3 | 5 → 53）。')],
    traps: [B('Read the scale on the axis carefully — each line may be 2, 5 or 10!', '小心看軸上的刻度——每格可能是 2、5 或 10！'),
    B('“More than 60” does NOT include 60. “60 or above” DOES include 60.', '「多於 60」不包括 60；「60 或以上」包括 60。'),
    B('✘ left side 3 | 5 = 35 &nbsp; ✔ = 53 in a back-to-back diagram', '✘ 背對背幹葉圖左邊 3 | 5 = 35 &nbsp; ✔ = 53'),
    B('✘ shoe size is continuous &nbsp; ✔ discrete (only certain sizes)', '✘ 鞋碼是連續數據 &nbsp; ✔ 離散數據（只有某些尺碼）')],
    cheat: [`${L('Pie', '圓形圖')}: ${fr(L('angle', '角度'), '360°')} × ${L('total', '總數')}`, `${L('Discrete = count; continuous = measure', '離散 = 數；連續 = 量')}`, `${L('Stem = tens, leaf = units; leaves in order; key!', '幹 = 十位，葉 = 個位；葉要排序；寫代號！')}`, `${L('Back-to-back left', '背對背左邊')}: 3 | 5 → 53`]
  });
})();
